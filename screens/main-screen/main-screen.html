<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Ach Vault</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="main-screen.css">
</head>
<body>
    <div class="grid">
        <div class="title theme-title">Ach's Safe Vault</div>

        <div class="input-container">
            <input type="text" id="searchInput" placeholder="Search platform or ID..." autocomplete="off">
            <span class="input-highlight"></span>
        </div>

        <div id="table">
            <span class="header">Platform</span>
            <span class="header">ID</span>
            <span class="header">Pwd</span>
            <span class="header">Action</span>
        </div>
        <div class="footer">
            <button id="addBtn" class="btn-theme">+ Add entry</button>
            <button id="exportBtn" class="btn-theme quiet">Export</button>
            <button id="importBtn" class="btn-theme quiet">Import</button>
            <button id="logout" class="btn-theme quiet">Bye !</button>
        </div>

        <dialog id="entryDialog">
            <div id="dialogTitle" class="dialog-title">Add entry</div>
            <label for="fPlatform">Platform</label>
            <input type="text" id="fPlatform" autocomplete="off">
            <label for="fId">ID</label>
            <input type="text" id="fId" autocomplete="off">
            <label for="fPwd">Password</label>
            <input type="text" id="fPwd" autocomplete="off">
            <div id="dialogError" class="dialog-error"></div>
            <div class="dialog-actions">
                <button type="button" id="dialogCancel" class="btn-theme quiet">Cancel</button>
                <button type="button" id="dialogSave" class="btn-theme">Save</button>
            </div>
        </dialog>
    </div>
    <script src="main-screen.js"></script>
</body>
